name: Set GHCR Packages Public

# 手动触发的维护任务：把本仓库发布的三个 GHCR 镜像包设为 public，
# 使 NAS / 服务器无需登录即可拉取。
# 仅在发布新包后需要时手动运行一次；镜像本身不需要重新构建。
on:
  workflow_dispatch:

jobs:
  make-public:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Set visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PKG_PREFIX: ${{ github.event.repository.name }}
        run: |
          set -u
          rc=0
          for svc in backend frontend backup; do
            name="${PKG_PREFIX}%2F${svc}"
            echo "::group::${svc}"
            out=$(curl -sS -w '\nHTTP_CODE=%{http_code}' -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user/packages/container/${name}" \
              -d '{"visibility":"public"}' || true)
            echo "$out"
            echo "::endgroup::"
            case "$out" in
              *HTTP_CODE=200*) echo "OK ${svc} -> public" ;;
              *) echo "FAILED ${svc}"; rc=1 ;;
            esac
          done
          echo "----"
          echo "exit_code=${rc}"
          exit ${rc}
