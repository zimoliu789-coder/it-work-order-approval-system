name: Build and Push Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - { name: backend, path: backend, dockerfile: Dockerfile }
          - { name: frontend, path: frontend, dockerfile: Dockerfile }
          - { name: backup, path: deploy/backup, dockerfile: Dockerfile }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service.name }}
          # 标签规则（注意：块标量里的 # 会被当成内容，注释只能写在这里）：
          #   type=ref,event=branch           → :main（⚠️ 不会产出 :latest）
          #   type=semver,...                 → 推 v1.0.0 时产出 :1.0.0
          #   type=raw,value=latest,...       → :latest，只在默认分支产出。
          #     这一行必须保留：deploy/docker-compose.yml 默认拉
          #     ${IMAGE_TAG:-latest}，缺了它 docker compose pull 会报 manifest unknown。
          #   type=sha,prefix=commit-         → :commit-ab12cd3（不可变，便于锁定/回滚）
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=commit-

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.path }}
          file: ${{ matrix.service.path }}/${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
