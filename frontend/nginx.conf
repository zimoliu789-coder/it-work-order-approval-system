server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # 缓存策略：构建产物带内容哈希，可长期缓存；
    # index.html 必须 no-store，否则用户会一直拿到旧的入口文件，
    # 出现「后端已更新、前端还是老界面」这类最难解释的现象。
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location = /favicon.ico {
        expires 7d;
        access_log off;
    }

    # SPA history 路由回退：/order/mine 这类前端路由必须回退到 index.html，
    # 否则用户刷新页面会得到 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 本容器只托管静态文件，不转发接口。
    # /api 由边缘 Nginx 直接代理到后端容器；若请求走到这里，说明边缘配置漏了 /api ——
    # 明确返回 404 便于定位，而不是回退到 index.html 变成「接口返回 HTML」的诡异前端报错。
    location /api/ {
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 静态托管不应暴露版本号
    server_tokens off;
}
