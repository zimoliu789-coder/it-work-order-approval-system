<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 响应式必备：手机端按设备宽度渲染，禁止用户缩放导致的布局错乱（规范 §3） -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f3a5f" />
    <!-- PWA（P1「手机 App」）：
         iOS 对 PWA 的支持比 Android 保守 —— 它不读 manifest 的部分字段、也不接受 SVG 图标，
         所以必须显式给 apple-touch-icon，并用下面这三个 apple- 前缀的 meta 声明
         「添加到主屏后全屏运行（不出现 Safari 地址栏）」。Android/桌面走 manifest，无需这些。 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 标准名（Chrome 会提示 apple- 前缀那条已废弃）。iOS 仍只认 apple- 前缀，
         所以两条都要留 —— 只写一条会在另一侧失效。 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="设备借用" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="企业内部设备借用工单系统" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3a5f'/%3E%3Cpath d='M9 11h14v3H9zm0 7h9v3H9z' fill='%23fff'/%3E%3C/svg%3E" />
    <title>设备借用工单系统</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
