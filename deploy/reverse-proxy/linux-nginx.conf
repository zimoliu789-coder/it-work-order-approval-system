# =====================================================================
# 通用 Linux 服务器：宿主 Nginx 反向代理 + TLS 示例
#
# 放置位置：/etc/nginx/conf.d/ticket-system.conf（或 sites-available + 软链）
# 证书位置：/etc/letsencrypt/live/ticket.example.com/（certbot 签发）
#
# 与容器内边缘 Nginx 的分工：
#   本文件（宿主） —— 负责 TLS 终止、HTTP→HTTPS 跳转、真实客户端 IP 注入；
#   容器内边缘 Nginx —— 负责站点路由（/ → 前端，/api → 后端）与限流兜底。
#   因此这里**不需要**再写 location /api 的转发规则，交给容器即可。
#
# 签发证书：certbot --nginx -d ticket.example.com
# 校验通过后：nginx -t && systemctl reload nginx
# =====================================================================

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name ticket.example.com;

    # 保留 ACME 校验路径，否则证书续期会因为跳转而失败
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ticket.example.com;

    # ---------------- 证书 ----------------
    ssl_certificate     /etc/letsencrypt/live/ticket.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ticket.example.com/privkey.pem;

    # 协议与套件：只留 TLS1.2/1.3，禁用已知弱套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---------------- 安全响应头 ----------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    server_tokens off;

    # 附件上传上限：与容器内边缘 Nginx(50m)、Spring multipart(50MB) 保持一致。
    # 三层只要有任意一层更严，用户就会在不同环节撞到互不相关的报错（413 / 500 / 业务提示）。
    client_max_body_size 50m;
    client_body_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8080;   # 指向容器映射到宿主的端口（WEB_PORT）

        proxy_http_version 1.1;

        # ---------------- 真实客户端 IP（最关键的四行） ----------------
        # X-Forwarded-For 用 proxy_add 追加而不是覆盖：容器内边缘 Nginx 会继续往后追加，
        # 后端据此才能沿链回溯出真实客户端。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 这一行决定了后端能否判断「用户走的是 HTTPS」——漏了它，
        # 後端会把所有请求当成 HTTP，Cookie 的 Secure 判定与绝对链接都会出错
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_set_header Connection "";

        # 导出报表等长耗时请求：默认 60s 会让用户看到「导出失败」而后端其实还在正常生成
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 大文件下载不缓冲，降低内存占用
        proxy_buffering off;
    }
}
