# =====================================================================
# 通用 Linux 服务器：Caddy 反向代理示例（自动 HTTPS，零证书运维）
#
# 放置位置：/etc/caddy/Caddyfile
# 生效命令：caddy validate --config /etc/caddy/Caddyfile && systemctl reload caddy
#
# Caddy 的优势：证书申请与续期全自动，无需 certbot、无需配 80 跳转。
# 唯一前提：域名解析到本机且 80/443 可从公网访问。
#
# ⚠️ 与 Nginx 方案的一个差异要注意：
#   Caddy 默认【丢弃】客户端自带的 X-Forwarded-For，并把它重写为真实对端地址，
#   这一点比 Nginx 默认行为更安全（Nginx 默认会保留并追加，左端可被伪造）。
#   因此使用 Caddy 时，后端拿到的 XFF 一定只有一个可信值，可信代理链判定天然成立。
# =====================================================================

ticket.example.com {
	# 反代到容器映射到宿主的端口（与 .env 的 WEB_PORT 保持一致）
	reverse_proxy 127.0.0.1:8080 {
		# 把真实客户端 IP 显式写入转发头。
		# Caddy 已经保证这些值不可被客户端伪造，因此后端可信代理链能正确回溯。
		header_up X-Real-IP {remote_host}
		header_up X-Forwarded-For {remote_host}
		header_up X-Forwarded-Proto {scheme}
		header_up X-Forwarded-Host {host}

		# 长耗时导出：默认无超时限制，这里显式给 300s 上限，
		# 避免异常连接长期占用连接数
		transport http {
			read_timeout 300s
			write_timeout 300s
		}
	}

	# 请求体上限：与容器内边缘 Nginx(50m)、Spring multipart(50MB) 对齐
	request_body {
		max_size 50MB
	}

	# 安全响应头（Caddy 默认不加 HSTS，需要显式声明）
	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		X-Content-Type-Options nosniff
		X-Frame-Options DENY
		Referrer-Policy strict-origin-when-cross-origin
		-Server
	}

	# 访问日志（排查线上问题时唯一的事实来源）
	log {
		output file /var/log/caddy/ticket-system.access.log {
			roll_size 50mb
			roll_keep 10
		}
		format json
	}

	encode gzip zstd
}

# ---------------------------------------------------------------------
# 内网 / 自签证书场景（没有公网域名时）
# Caddy 会使用内置 CA 签发证书，需要把 Caddy 的根证书导入客户端，否则浏览器报警告。
# 取消下面注释即可启用：
# ---------------------------------------------------------------------
# ticket.internal {
# 	tls internal
# 	reverse_proxy 127.0.0.1:8080 {
# 		header_up X-Forwarded-Proto {scheme}
# 		header_up X-Real-IP {remote_host}
# 	}
# }
