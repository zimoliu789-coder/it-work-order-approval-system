# =====================================================================
# 边缘 Nginx 主配置（：Nginx 反向代理）
#
# 定位：容器内的统一入口。外层还有一层反向代理处理 TLS
#      （群晖 DSM 反向代理，或宿主 Nginx / Caddy），
#      本容器只监听 80，由 compose 映射到宿主机高位端口（默认 8080）。
#
#      客户端 → 外层反代(TLS) → 本容器:80 ─┬→ frontend:80   静态资源
#                                          └→ backend:8080  /api
#
# 不在这里做 TLS 的原因：证书生命周期（签发 / 自动续期）应由对外的那一层统一管理，
# 容器内再放一份证书会让「续期只成功了一半」变成难以察觉的故障。
# =====================================================================

user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" real_ip=$client_real_ip xff="$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time trace=$upstream_http_x_trace_id';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # 与后端 spring.servlet.multipart.max-request-size(50MB) 对齐：
    # 边缘若比应用更严，用户传附件会在 Nginx 层被拦成 413，错误信息与业务无关，极难排查
    client_max_body_size 50m;
    client_body_timeout  120s;
    client_header_timeout 20s;

    # ------------------------------------------------------------------
    # 真实客户端 IP（ 限流维度的前提）
    #
    # 外层反代把客户端 IP 追加到 X-Forwarded-For 的【最右侧】（$proxy_add_x_forwarded_for 语义），
    # 因此取最右一段作为限流键；左端值是客户端可伪造的，用它做限流键等于没有限流。
    # 没有 XFF 时（直接访问边缘，例如首次部署自测）回落到 TCP 对端地址。
    # ------------------------------------------------------------------
    map $http_x_forwarded_for $xff_last {
        "~^.*,\s*(?<tail>[^,\s]+)\s*$"  $tail;
        "~^([^,\s]+)\s*$"               $1;
        default                         "";
    }

    map $xff_last $client_real_ip {
        ""       $remote_addr;
        default  $xff_last;
    }

    # ------------------------------------------------------------------
    # 原始协议：外层是 HTTPS，但外层→边缘是明文 HTTP。
    # 若直接写 $scheme，会把外层的 https 覆盖成 http，导致后端永远认为用户在走 HTTP。
    # 因此优先沿用传入的 X-Forwarded-Proto，缺失时才回落到 $scheme。
    # ------------------------------------------------------------------
    map $http_x_forwarded_proto $forwarded_proto {
        default  $http_x_forwarded_proto;
        ""       $scheme;
    }

    # ------------------------------------------------------------------
    # 限流区（ 的第一道防线）
    # 应用层限流是权威（能按账号/用户维度判定），这里是抗流量的粗粒度兜底：
    #   - 登录接口按 IP 更严（20r/m ≈ 3 秒 1 次，配合 burst 允许少量连续尝试）
    #     刻意比应用层（同 IP 5 次/分钟）宽松，避免两层阈值互相打脸、把排查引偏；
    #   - /api 全局限速宽松（600r/m = 10r/s），只拦明显异常的量级。
    # 真正的业务阈值以系统参数页为准，改这里需要 reload nginx，改参数页即时生效。
    # ------------------------------------------------------------------
    limit_req_zone $client_real_ip zone=login_zone:10m rate=20r/m;
    limit_req_zone $client_real_ip zone=api_zone:10m   rate=600r/m;

    limit_req_status   429;
    limit_req_log_level warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    include /etc/nginx/conf.d/*.conf;
}
