# =====================================================================
# 边缘 Nginx 站点配置（容器内监听 80；宿主机端口由 compose 的 WEB_PORT 映射）
#
# 路由：
#   /api/auth/login  → backend   登录接口，按 IP 严格限流（第一道防线）
#   /api/            → backend   业务接口，按 IP 宽松兜底限流
#   /                → frontend  前端静态资源（SPA）
# =====================================================================

# 动态 DNS 解析：Docker 内置 DNS。
# 为什么需要：nginx 默认在【启动时】解析 proxy_pass 里的主机名并一直缓存 IP。
# 后端容器一旦重建（升级镜像、改环境变量）就可能拿到新 IP，此时 nginx 仍指向旧 IP，
# 表现为「容器都在跑，但接口全 502」——这是 Docker + Nginx 组合最常见的部署事故。
# 配合下面 proxy_pass 使用变量，nginx 会在 TTL 内重新解析，无需重启本容器。
# 注：127.0.0.11 是 Docker 的嵌入式 DNS；若换成 Podman 等其它运行时需相应调整。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # ------------------------------------------------------------------
    # 上游地址变量
    # ⚠️ 这两行必须写在 server 上下文内，不能提到文件顶层。
    #    本文件由 nginx.conf 的 `include /etc/nginx/conf.d/*.conf;` 引入，而该 include
    #    位于 `http {}` 块内 ⇒ 本文件的顶层等价于 http 上下文；而 `set` 指令只允许
    #    出现在 server / location / if 中。写在顶层会让 nginx 启动即报
    #      [emerg] "set" directive is not allowed here in /etc/nginx/conf.d/ticket.conf:NN
    #    并立即退出，容器进入重启循环、宿主端口无人监听（浏览器表现为 ERR_CONNECTION_REFUSED）。
    # 使用变量形式的 proxy_pass 时必须用 $request_uri 显式带上原始 URI，
    # 否则 nginx 只把「/」转给上游（会得到一堆 404）。
    # ------------------------------------------------------------------
    set $backend_upstream  http://backend:8080;
    set $frontend_upstream http://frontend:80;

    # ------------------------------------------------------------------
    # 安全响应头
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 显式关闭浏览器内置的 XSS 过滤器：现代浏览器已移除该能力，
    # 而旧过滤器反而可能被利用做「反射型 XSS 变信息泄露」，安全指南建议置 0
    add_header X-XSS-Protection "0" always;

    # ------------------------------------------------------------------
    # 登录接口：按真实客户端 IP 严格限流
    # burst=5 nodelay 允许短时间内连续 5 次（用户手滑重试不至于立刻被挡），
    # 之后按 20r/m 放行。应用层还有「同 IP 5 次/分钟 + 同账号 3 次/分钟」的更严约束。
    # ------------------------------------------------------------------
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        error_page 429 = @rate_limited;

        include /etc/nginx/snippets/api-proxy.conf;
        proxy_pass $backend_upstream$request_uri;
    }

    # ------------------------------------------------------------------
    # 业务接口：宽松兜底限流（真正的业务阈值在「系统参数设置」页，改完即时生效）
    # ------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_zone burst=300 nodelay;
        error_page 429 = @rate_limited;

        include /etc/nginx/snippets/api-proxy.conf;
        proxy_pass $backend_upstream$request_uri;
    }

    # ------------------------------------------------------------------
    # 前端静态资源
    # ------------------------------------------------------------------
    location / {
        include /etc/nginx/snippets/static-proxy.conf;
        proxy_pass $frontend_upstream$request_uri;
    }

    # ------------------------------------------------------------------
    # 限流响应：返回与后端完全一致的统一信封（），
    # 前端因此无需为「Nginx 限流」和「应用限流」写两套分支。
    # ------------------------------------------------------------------
    location @rate_limited {
        default_type application/json;
        charset utf-8;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"code":"RATE_LIMITED","message":"操作过于频繁，请 5 秒后重试","data":{"retryAfterSeconds":5}}';
    }

    # 兜底错误页也返回 JSON，避免前端在接口 502 时收到一坨 HTML
    error_page 502 503 504 = @upstream_down;
    location @upstream_down {
        default_type application/json;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        return 503 '{"code":"SERVICE_UNAVAILABLE","message":"后端服务暂不可用，请稍后重试"}';
    }
}
