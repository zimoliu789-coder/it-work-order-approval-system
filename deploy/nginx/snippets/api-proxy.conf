# /api 反代到后端容器的公共头（被 ticket.conf 的各个 location include）

proxy_http_version 1.1;

# 保留外层反代传入的 Host，便于后端生成绝对链接与日志排查
proxy_set_header Host $host;

# 真实客户端 IP：$client_real_ip 由 nginx.conf 的 map 从 X-Forwarded-For 最右段解析而来。
# 这里【覆盖】X-Real-IP 为解析结果，让后端的 X-Real-IP 兜底分支也拿到正确值。
proxy_set_header X-Real-IP $client_real_ip;

# $proxy_add_x_forwarded_for = 传入的 XFF + 本机地址。
# 追加本机地址这一步是后端「可信代理链」判定能成立的关键：
# 后端才能知道「最右这一段是我方代理写的」，从而只信任它右侧的部分。
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

# 原始协议（外层是 HTTPS，但外层→本容器是明文）。取值见 nginx.conf 的 $forwarded_proto map。
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# 清空 Connection 让上游 keepalive 生效（HTTP/1.1 下不清空会退化成短连接）
proxy_set_header Connection "";

proxy_connect_timeout 10s;
# 读写超时给足 300s：统计报表导出、批量导入的响应时间可能远超默认 60s，
# 超时中断会让用户看到「导出失败」，但后端其实仍在正常生成文件
proxy_send_timeout    300s;
proxy_read_timeout    300s;

# 大文件下载（导出 Excel）不缓冲，降低内存占用并支持更早开始传输
proxy_buffering off;
